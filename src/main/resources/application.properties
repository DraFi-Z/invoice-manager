# Application name
spring.application.name=invoice-manager

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/billing_db
spring.datasource.username=billing_user
spring.datasource.password=billing_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=3f8a2b1c7d7e6f4a5b2c2d1e0f9a8b4c6d5e4z3a2b1c0d9e8f7a6b5c4d3e2l1a
app.jwt.expiration=86400000

# Server port
server.port=8080

# Logging
logging.level.com.billing.invoice_manager=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.endpoint.health.roles=ADMIN

info.app.name=Invoice Manager
info.app.description=Billing and Invoice Management System
info.app.version=1.0.0